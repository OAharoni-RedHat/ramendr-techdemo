---
# ODF/Ceph storage overlay for ramendr-techdemo.
# Applied by `make install-odf`, which extracts each section and merges it into
# the corresponding values file before running the install.
#
# odf.enabled: true — activates the odf subchart condition in both
#   opp-policy-chart (charts/opp-odf/) and regionaldr-with-virt-chart (charts/rdr-odf/).
# This file is also added to the extraValueFiles of the opp-policy and rdr Argo CD apps
# so the subchart condition flag reaches those charts at render time.

odf:
  enabled: true
  postInstallFixesEnabled: true

# VM storage class for edge-gitops-vms — merged into overrides/values-egv-dr.yaml
egvDr:
  vmDefaults:
    storageClassName: "ocs-storagecluster-ceph-rbd-virtualization"

# Console plugins — appended to the base plugin lists
consolePluginsHub:
  ensureConsolePlugins:
    - odf-console
    - odf-multicluster-console

consolePluginsSpokes:
  ensureConsolePlugins:
    - odf-console

hub:
  clusterGroup:
    namespaces:
      openshift-storage:

    subscriptions:
      odf-multicluster-orchestrator:
        name: odf-multicluster-orchestrator
        namespace: openshift-operators

      openshift-data-foundation:
        name: odf-operator
        namespace: openshift-storage

    applications:
      # Enable the odf subchart in opp-policy and rdr by passing this file as extraValueFiles.
      opp-policy:
        extraValueFiles:
          - '$patternref/overrides/values-storage-odf.yaml'
      rdr:
        extraValueFiles:
          - '$patternref/overrides/values-storage-odf.yaml'

      odf:
        name: odf
        namespace: openshift-storage
        project: opp
        chart: openshift-data-foundations
        chartVersion: 0.2.*
        syncOptions:
          - CreateNamespace=true
        extraValueFiles:
          - '$patternref/overrides/values-odf-chart.yaml'

resilient:
  clusterGroup:
    namespaces:
      openshift-storage:
      openshift-adp:
        operatorGroup: true
        targetNamespaces:
          - openshift-adp

    subscriptions:
      openshift-data-foundation:
        name: odf-operator
        namespace: openshift-storage

      openshift-oadp:
        name: redhat-oadp-operator
        namespace: openshift-adp
        channel: stable

    applications:
      odf:
        name: odf
        namespace: openshift-storage
        project: resilient
        chart: openshift-data-foundations
        chartVersion: 0.2.*
        syncOptions:
          - CreateNamespace=true
        extraValueFiles:
          - '$patternref/overrides/values-odf-chart.yaml'

      adp-data-protection:
        name: adp-data-protection-application
        namespace: openshift-adp
        project: resilient
        repoURL: https://github.com/validatedpatterns/oadp-data-protection-application-chart.git
        chartVersion: main
        path: "."

    imperative:
      jobs:
        - name: clean-golden-images
          playbook: ansible/odf_fix_dataimportcrons.yml
          verbosity: -vvv
      clusterRoleYaml:
        - apiGroups:
            - "*"
          resources:
            - persistentvolumeclaims
            - datavolumes
            - dataimportcrons
            - datasources
          verbs:
            - "*"
        - apiGroups:
            - "*"
          resources:
            - "*"
          verbs:
            - get
            - list
            - watch
